#PIPELINE NAME AND PERMISSION
name: Product Service CI/CD

permissions:
  contents: read


#TRIGGER ZONE
on:
  push:
    branches:
      - main
  workflow_dispatch:
  
#JOB
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            chrixus88/product-service:latest
            chrixus88/product-service:${{ github.sha }}


      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chrixus88/product-service:${{ github.sha }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      

      - name: Push Docker image
        run: |
          docker push chrixus88/product-service:latest
          docker push chrixus88/product-service:${{ github.sha }}